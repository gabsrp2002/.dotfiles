# vim:fileencoding=utf-8:foldmethod=marker

#: Fonts
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        20.0

#: Cursor
cursor                    #cccccc
cursor_text_color         #111111
cursor_shape              beam
cursor_beam_thickness     0
cursor_blink_interval     -1
cursor_stop_blinking_after 15.0

#: Mouse & performance
mouse_hide_wait -1
repaint_delay   1

#: Terminal bell
enable_audio_bell    no
visual_bell_duration 0.1
window_alert_on_bell yes
bell_on_tab          yes

#: Window layout
enabled_layouts tall, stack

#: Color scheme
include ./theme.conf
background_opacity 0.85

#: Advanced
editor nvim

#: macOS tweaks
macos_option_as_alt              left
macos_quit_when_last_window_closed yes
macos_traditional_fullscreen     yes

#: Keyboard shortcuts
clear_all_shortcuts yes
kitty_mod shift+cmd

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Window management
map kitty_mod+; new_window
map kitty_mod+w close_window
map kitty_mod+l next_window
map kitty_mod+h previous_window

# Layout management
map kitty_mod+j goto_layout tall
map kitty_mod+k goto_layout stack

# Font sizes
map cmd+equal     change_font_size all +2.0
map cmd+minus     change_font_size all -2.0
map cmd+backspace change_font_size all 0

# Miscellaneous
map kitty_mod+f toggle_fullscreen
map kitty_mod+r load_config_file

include ${KITTY_OS}.conf
