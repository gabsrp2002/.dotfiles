# Rift configuration — migrated from Aerospace.
# Original: aerospace/.config/aerospace/aerospace.toml
# Reference: https://acsandmann.github.io/rift-docs/
# Validate with: rift-cli execute config reload

[settings]
# Animations stay on (main reason for migrating off Aerospace).
animate = true
animation_duration = 0.3
animation_fps = 60.0

# Manage new macOS spaces by default (matches Aerospace behavior).
default_disable = false

# Mouse/focus behavior (matches Aerospace: focus-follows-mouse + mouse-follows-focus).
focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = true

# Scrolling wants displays arranged vertically in macOS (all displays share one
# coordinate space, so side-by-side displays let off-screen columns leak onto a
# neighbor). Keep the physical side-by-side feel: warp the pointer across the
# logical vertical chain as if the displays were left/right.
horizontal_mouse_warp = "top-to-bottom"

# Apps that must not steal focus / trigger workspace switches.
auto_focus_blacklist = []

hot_reload = true

# Notify Sketchybar about workspace and window changes. Scrolling also needs
# focused_window_changed (scrolling the strip changes which columns are visible
# without changing the window set) and layout_changed (column-width/geometry
# changes, e.g. Alt+F) so window icons refresh.
run_on_start = [
  "rift-cli subscribe cli --event workspace_changed --command sh --args -c --args 'sketchybar --trigger rift_workspace_changed'",
  "rift-cli subscribe cli --event windows_changed --command sh --args -c --args 'sketchybar --trigger rift_windows_changed'",
  "rift-cli subscribe cli --event focused_window_changed --command sh --args -c --args 'sketchybar --trigger rift_windows_changed'",
  "rift-cli subscribe cli --event layout_changed --command sh --args -c --args 'sketchybar --trigger rift_windows_changed'",
  "rift-cli subscribe cli --event binding_mode_changed --command sh --args -c --args 'sketchybar --trigger rift_mode_change'",
]

[settings.ui.stack_line]
# Native stack indicator. thickness has a hard minimum of 20 (the 0.7.0
# stackline rewrite); selected_color was dropped upstream with that rewrite.
enabled = true
hover = "hover"
horiz_placement = "top"
vert_placement = "left"
thickness = 20.0
spacing = 1.0

[settings.ui.menu_bar]
enabled = false
show_empty = false
show_binding_mode = true

[settings.gestures]
# Three-finger horizontal swipes switch workspaces, skipping empty ones
# (matches Alt+N/P behavior).
enabled = true
consume_dock_swipe = true
fingers = 3
skip_empty = true
haptics_enabled = false

[settings.layout]
# Default layout: scrolling strip of columns (was Aerospace `tiles`).
mode = "scrolling"
window_insertion_point = "next_to_selection"

[settings.drag_drop]
drop_action = "stack"

# Sway-style node normalization on insert (replaces Aerospace
# enable-normalization-flatten-containers, so no flatten keybind is needed).
[settings.layout.traditional]
equalize_nodes = true

[settings.layout.scrolling]
# Each column is half the tiling area, so two windows sit side by side.
column_width_ratio = 0.5
min_column_width_ratio = 0.3
max_column_width_ratio = 1.0
# Alt+F cycles a window between one column (0.5) and two columns (1.0). Order
# matters: the cycler picks the first preset wider than the current width, so
# with [1.0, 0.5] anything below 1.0 goes to 1.0 and exactly-1.0 wraps to 0.5.
preset_column_widths = [1.0, 0.5]
# Lone column fills the width; its stored width returns once a column returns.
expand_single_column = true
# Force arrivals to column_width_ratio so pairs tile edge-to-edge (preserved
# widths would leave permanent neighbor slivers).
preserve_window_sizes = false
# Focused-column placement; niri only scrolls as far as needed to reveal it.
alignment = "center"
focus_navigation_style = "niri"

[settings.layout.stack]
# No offset: stacked windows overlap exactly (was 40.0).
stack_offset = 0.0
default_orientation = "perpendicular"

[settings.layout.gaps]
# Uniform outer top gap leaves room for Sketchybar (was conditional in Aerospace).
[settings.layout.gaps.outer]
# Uniform visual margins on all displays: sketchybar (32) + offset (8).
# Rift measures from each screen's edge, and the built-in sits 32px lower
# (arrangement offset), so it only needs 8 to land at the same line.
top = 40
left = 8
bottom = 8
right = 8

[settings.layout.gaps.per_display."37D8832A-2D66-02CA-B9F7-8F30A301B230".outer]
# NOTE: overrides REPLACE the whole outer table (no merging), so all four
# edges must be spelled out; omitted ones default to 0.
top = 8
left = 8
bottom = 8
right = 8

[settings.layout.gaps.inner]
horizontal = 10
vertical = 10

[virtual_workspaces]
enabled = true
# Start with a single empty workspace; the rest are created on demand (Alt + C).
default_workspace_count = 1
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
reapply_app_rules_on_title_change = false
# No named workspaces: indexes are used as-is, created on demand (Alt + C).
workspace_names = []
# Start on workspace 0 (the only initial workspace).
default_workspace = 0

# Floating windows (were Aerospace on-window-detected `layout floating` rules).
# position centers each floating window on arrival (fraction of free travel).
[[virtual_workspaces.app_rules]]
app_id = "com.apple.weather"
floating = true
position = { x = 0.5, y = 0.5 }

[[virtual_workspaces.app_rules]]
app_id = "com.apple.finder"
floating = true
position = { x = 0.5, y = 0.5 }

[[virtual_workspaces.app_rules]]
app_name = "mpv"
floating = true
position = { x = 0.5, y = 0.5 }

[[virtual_workspaces.app_rules]]
app_id = "com.bitwarden.desktop"
floating = true
position = { x = 0.5, y = 0.5 }

[[virtual_workspaces.app_rules]]
app_id = "com.workpuls.Agent"
floating = true
position = { x = 0.5, y = 0.5 }

[modifier_combinations]
comb1 = "Alt + Shift"

[keys]
"Alt + Z" = "toggle_space_activated"

# New terminal in a tmux session (wrapped in zsh so ~ expands; Rift launches directly).
"Ctrl + Shift + T" = { exec = ["/bin/zsh", "-c", "kitty --single-instance -d ~ -e tmux new -A -s default"] }

# Layouts: scrolling strip (default) or overlapping stack.
"Alt + Slash" = { set_workspace_layout = { mode = "scrolling" } }
"Alt + Semicolon" = { set_workspace_layout = { mode = "stack" } }

# Focus mpv wherever it is, otherwise open the most recent Onepace note.
"Alt + O" = { exec = ["/bin/zsh", "-c", "~/scripts/focus_mpv_or_onepace"] }

"Alt + T" = { exec = ["/bin/zsh", "-c", "~/scripts/gemini-temp"] }
"Alt + G" = { exec = ["open", "-a", "Gemini"] }

# Focus windows (mouse follows via mouse_follows_focus). In scrolling layout,
# left/right move within the strip and stop at the edge (never cross displays);
# up/down move within the column and DO cross to the vertically-adjacent
# display. Use the display-focus keys to switch displays.
"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }

# Move windows. In scrolling layout a shared column ejects into a new adjacent
# column, a lone column reorders, and at the strip edge the window crosses to
# the adjacent display (native move_node crosses displays in every layout).
"comb1 + H" = { move_node = "left" }
"comb1 + J" = { move_node = "down" }
"comb1 + K" = { move_node = "up" }
"comb1 + L" = { move_node = "right" }

# Alt+F cycles the focused column between one (0.5) and two (1.0) columns (see
# preset_column_widths). Fullscreen-within-gaps is no longer bound; true
# fullscreen stays on Alt+Shift+F.
"Alt + F" = "switch_preset_column_width"
"Alt + Shift + F" = { exec = ["/bin/zsh", "-c", "~/scripts/toggle_fullscreen"] }
"Alt + Shift + Space" = "toggle_window_floating"

"Alt + Enter" = { toggle_window_floating = { center = true } }

# New workspace (create auto-switches; script moves the focused window and follows).
"Alt + C" = { exec = ["/bin/zsh", "-c", "~/scripts/move_to_new_ws"] }

# Next/previous workspace, skipping empty ones.
# (Script wrapper: native next/prev always lands on empties.)
"Alt + N" = { exec = ["/bin/zsh", "-c", "~/scripts/focus_next_prev next"] }
"Alt + P" = { exec = ["/bin/zsh", "-c", "~/scripts/focus_next_prev prev"] }

# Move focused window to next/previous non-empty workspace and follow it.
# (Script wrapper: Rift's move_window_to_workspace cannot skip empties.)
"comb1 + N" = { exec = ["/bin/zsh", "-c", "~/scripts/move_window_next_prev next"] }
"comb1 + P" = { exec = ["/bin/zsh", "-c", "~/scripts/move_window_next_prev prev"] }

# Move a single window to another display, focus follows (was Aerospace
# move-node-to-monitor --focus-follows-window).
"Alt + Cmd + H" = { move_window_to_display = { selector = "left" } }
"Alt + Cmd + L" = { move_window_to_display = { selector = "right" } }

# Move the entire active workspace to another display (was move_to_monitor script).
"Ctrl + Alt + Cmd + H" = { move_workspace_to_display = { selector = "left", wrap_around = true } }
"Ctrl + Alt + Cmd + L" = { move_workspace_to_display = { selector = "right", wrap_around = true } }

# Toggle Sketchybar visibility (was service-mode `b`).
"Alt + B" = { exec = ["sketchybar", "--bar", "topmost=toggle"] }

# Resize mode (restored Aerospace mode; single command per key, so no
# sketchybar mode indicator is possible).
"Alt + R" = { binding_mode = "resize" }

# Service mode (restored Aerospace mode).
"Alt + Shift + Semicolon" = { binding_mode = "service" }

[binding_modes.resize]
"H" = { resize_window_shrink = "horizontal" }
"L" = { resize_window_grow = "horizontal" }
"J" = { resize_window_grow = "vertical" }
"K" = { resize_window_shrink = "vertical" }
"Enter" = { binding_mode = "default" }
"Escape" = { binding_mode = "default" }

[binding_modes.service]
# One-shot actions: each acts, then drops back to the default mode (single
# command per key, so action + reset are wrapped in a shell call).
"B" = { exec = ["/bin/zsh", "-c", "sketchybar --bar topmost=toggle; rift-cli execute binding-mode default"] }
"R" = { exec = ["/bin/zsh", "-c", "rift-cli execute layout unjoin; rift-cli execute binding-mode default"] }
"F" = { exec = ["/bin/zsh", "-c", "rift-cli execute window toggle-float; rift-cli execute binding-mode default"] }
"Escape" = { binding_mode = "default" }
